submission:
  title: "WaferPulse: 3nm Fab Yield Root Cause & Batch Risk Analyser"

  problem_statement: >
    "At sub-5nm process nodes, a 1% wafer yield drop costs chipmakers tens of millions of dollars monthly. Root causes hide across thousands of equipment sensors, and engineers spend weeks manually isolating them while upcoming lots remain at risk of failure."

  solution_summary: >
    "We built an autonomous semiconductor diagnostic system that classifies spatial defect maps, ranks equipment root causes using Tree-SHAP telemetry attribution, and predicts scrap risk for upcoming batches before chamber processing, orchestrated conversationally via an IBM Bob FastMCP server."

  key_features:
    - "Automated spatial wafer defect pattern classification mapped to fab process modules"
    - "Tree-SHAP equipment telemetry attribution ranking root causes by probability and sigma drift"
    - "Pre-dispatch batch risk predictor preventing processing of at-risk wafer lots"
    - "Load-bearing IBM Bob Model Context Protocol (MCP) server for conversational fab triage"
    - "Interactive Streamlit engineering operations dashboard with real-time wafer map visualization"

  tech_stack:
    languages: ["Python"]
    frameworks: ["Streamlit", "FastMCP", "Scikit-Learn"]
    ibm_technologies: ["IBM Bob", "Model Context Protocol"]
    databases: ["Pandas DataFrame", "CSV"]
    other: ["Tree-SHAP", "NumPy", "Matplotlib"]

  what_we_are_most_proud_of: >
    "Grounding our machine learning models in real semiconductor physics (RIE focus ring erosion, CMP pressure spikes, EUV focal tilt) coupled directly to an IBM Bob FastMCP agent for autonomous root cause resolution."

  known_limitations: >
    "Trained on 8 primary lithography, etch, and CMP sensor telemetry variables; full commercial fab deployment would ingest thousands of inline fault detection and classification (FDC) sensor channels."

